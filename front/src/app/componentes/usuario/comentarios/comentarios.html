@if (!resumen()) {
    <form class="nuevo-comentario" [formGroup]="formComentario" (ngSubmit)="crearComentario()">
        <div class="fila">
            <textarea formControlName="mensaje" placeholder="Escribí un comentario..."></textarea>
            <button type="submit" class="btn btn-sm btn-primary" [disabled]="formComentario.invalid">Comentar</button>
        </div>
        <small>{{ formComentario.controls.mensaje.value?.length || 0 }}/300</small>
    </form>
}

@if (error()) {
    <p class="msg-error">{{ error() }}</p>
}

@for (comentario of comentarios(); track comentario._id) {
    <app-card-comentario [comentario]="comentario"
                        (modificado)="recargar()"
                        (eliminada)="recargar()" />
} @empty {
    <p class="vacio">Todavía no hay comentarios.</p>
    
}

@if (hayMas() && !resumen()) {
    <button type="button" class="btn btn-sm" (click)="cargarMas()">Cargar más</button>
}
