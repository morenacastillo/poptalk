@if (error()) {
    <p class="msg-error">{{ error() }}</p>
}

@if (modalAbierto()) {
    <app-modal-publicacion (cerrar)="modalAbierto.set(false)" (creada)="subirPublicacion()" />
}

<div class="orden">
    <span class="lbl">Ordenar por:</span>
    <button type="button" class="tab" [class.on]="orden() === 'fecha'" (click)="cambiarOrden('fecha')">Más recientes</button>
    <button type="button" class="tab" [class.on]="orden() === 'megusta'" (click)="cambiarOrden('megusta')">Más me gusta</button>
    <button type="button" class="btn btn-publicar" (click)="modalAbierto.set(true)">+ Nueva publicación</button>
</div>

@for (publicacion of publicaciones(); track publicacion._id) {
    <app-card-publicacion [publicacion]="publicacion"
                        (eliminada)="obtenerPublicacionesHome()"
                        (cambiada)="obtenerPublicacionesHome()" />
}

<div class="paginacion">
    <button type="button" class="btn btn-sm" (click)="anterior()" [disabled]="pagina() === 0">Anterior</button>
    <span>Página {{ pagina() + 1 }}</span>
    <button type="button" class="btn btn-sm" (click)="siguiente()" [disabled]="!hayMas()">Siguiente</button>
</div>
