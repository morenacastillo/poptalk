<h2>{{ usuario?.nombre }} {{ usuario?.apellido }}</h2>
<p>{{ usuario?.correo }}</p>
<p>@{{ usuario?.nombreUsuario }}</p>
<p>{{ usuario?.descripcion }}</p>
@if (usuario?.imagen) {
    <img [src]="usuario?.imagen" alt="Foto de perfil" />
}

<button class="btn" (click)="modalAbierto.set(true)">Contanos tu opinión...</button>

@if (modalAbierto()) {
    <app-modal-publicacion (cerrar)="modalAbierto.set(false)" (creada)="subirPublicacion()" />
}

<br>
<hr>


@for (publicacion of publicacionesUsuario(); track publicacion._id) {
    <app-card-publicacion [publicacion]="publicacion" />
}
